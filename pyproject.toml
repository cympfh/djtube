[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djtube"
version = "0.1.0"
description = "Two-deck YouTube DJ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2025.9.23",
    "yt-dlp-ejs==0.8.0",
]

[dependency-groups]
dev = [
    "black>=25",
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.hatch.build.targets.wheel]
packages = ["djtube"]

[tool.hatch.build.targets.wheel.force-include]
"djtube/static" = "djtube/static"
"djtube/templates" = "djtube/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
