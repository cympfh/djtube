services:
  djtube:
    build: .
    ports:
      - "8098:8098"
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DJTUBE_PLAYLISTS: /app/data/playlists.json
      DJTUBE_COOKIES: /app/data/cookies.txt
      DJTUBE_AUDIO_CACHE: /app/data/audio-cache.json
    volumes:
      - djtube-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  djtube-data:
